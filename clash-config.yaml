proxy-groups:
  - name: "AUTO"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 60
    lazy: false
    proxies:
      - "EDT-Pages-A"
      - "EDT-Pages-B"
      - "EDT-Pages-C"
      - "EDT-Pages-D"
      - "EDT-Pages-E"
      - "EDT-Pages-F"
      - "EDT-Pages-G"
      - "EDT-Pages-H"
  - name: "PROXY"
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 120
    proxies:
      - "AUTO"
      - "EDT-Pages-A"
      - "EDT-Pages-B"
      - "EDT-Pages-C"
      - "EDT-Pages-D"
      - "EDT-Pages-E"
      - "EDT-Pages-F"
      - "EDT-Pages-G"
      - "EDT-Pages-H"
  - name: "CF-CHALLENGE"
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "EDT-CF-Pinned-A"
      - "EDT-CF-Pinned-B"

rules:
  # QUIC/HTTP3 (UDP 443) is filtered here and the WS transport only carries TCP
  # + DNS UDP anyway. Rejecting it makes browsers fall back to HTTP/1.1 fast
  # instead of stalling on a protocol that can never complete.
  - AND,((NETWORK,UDP),(DSTPORT,443)),REJECT
  # Cloudflare managed-challenge-prone domains: stable egress IP + real browser.
  - DOMAIN-SUFFIX,medium.com,CF-CHALLENGE
  - DOMAIN-SUFFIX,udemy.com,CF-CHALLENGE
  - DOMAIN-SUFFIX,stackoverflow.com,CF-CHALLENGE
  - DOMAIN-SUFFIX,stackexchange.com,CF-CHALLENGE
  - DOMAIN-SUFFIX,superuser.com,CF-CHALLENGE
  - DOMAIN-SUFFIX,serverfault.com,CF-CHALLENGE
  - DOMAIN-SUFFIX,cloudflare.com,CF-CHALLENGE
  - DOMAIN-SUFFIX,discord.com,CF-CHALLENGE
  - DOMAIN-SUFFIX,x.com,CF-CHALLENGE
  - DOMAIN-SUFFIX,linkedin.com,CF-CHALLENGE
  - DOMAIN-SUFFIX,whatsapp.com,CF-CHALLENGE
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
