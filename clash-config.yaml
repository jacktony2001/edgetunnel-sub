# mihomo / Clash Meta — generated by ip-health.mjs
# All nodes below were verified with a real HTTPS request (HTTP 200).
# CF-CHALLENGE uses ONE pinned ProxyIP per node: Cloudflare binds cf_clearance
# to the egress IP, so a rotating relay pool would invalidate it on every
# connection and keep re-issuing "Just a moment...".
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

